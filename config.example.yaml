server:
  url: "wss://api.tracee.example.com/ws/agent"
  token: "votre-token-agent-ici"

capture:
  default_interface: "wlan0"   # surchargé par --interface
  snaplen: 512

logging:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR | CRITICAL
  file: null                   # null = stderr (dev) ; chemin = fichier (prod,
                               # ex. /var/log/tracee-agent.log — le répertoire
                               # doit exister et être accessible en écriture)
