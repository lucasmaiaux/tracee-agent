name: Release

# Deux déclencheurs pour un même travail :
#   - un tag poussé (GitLab : `rules: - if: $CI_COMMIT_TAG`) — y compris le tag que
#     GitHub crée quand on publie une release depuis « Releases → Draft a new release » ;
#   - un lancement manuel depuis l'onglet Actions, qui évite toute manipulation de tag :
#     `gh release create` le pose lui-même s'il n'existe pas.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.1.0)"
        required: true

# Spécificité GitHub : le GITHUB_TOKEN est en lecture seule par défaut. Créer une
# release exige de l'élever explicitement — il n'y a pas d'équivalent GitLab, où le
# token du job porte déjà les droits du déclencheur.
permissions:
  contents: write

jobs:
  build:
    name: Executable (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      # PyInstaller ne cross-compile pas : chaque cible exige un runner de son système.
      # Sans `fail-fast: false`, un échec côté Windows annulerait le build Linux, et on
      # se retrouverait sans aucun binaire — précisément ce qu'on veut éviter.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            built: dist/tracee-agent
            asset: tracee-agent-linux-x86_64
          - os: windows-latest
            label: Windows
            built: dist/tracee-agent.exe
            asset: tracee-agent-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Tkinter est une liaison vers Tcl/Tk, livrée par un paquet système séparé et
      # absente des runners Linux. Windows l'inclut d'office.
      - name: Install Tcl/Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: uv sync --frozen

      # Échouer ici, et non trois étapes plus loin avec un binaire muet entre les mains.
      - name: Check that Tkinter is available
        run: uv run python -c "import tkinter; print('Tcl/Tk', tkinter.TkVersion)"

      - name: Build executable
        run: uv run pyinstaller --noconfirm --distpath dist --workpath build packaging/tracee-agent.spec

      - name: Name the asset after its platform
        # Git Bash est présent sur les runners Windows : l'imposer évite d'écrire la
        # même étape deux fois, une pour sh et une pour PowerShell.
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          # Un binaire absent doit faire échouer le job ici, pas produire une release vide.
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Contrairement à GitLab, les artefacts des jobs précédents ne sont pas récupérés
      # automatiquement : il faut les redemander.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the GitHub release
        # `gh` est préinstallé sur les runners : pas d'action tierce à qui faire confiance,
        # et les mêmes commandes se rejouent à la main depuis un poste si besoin.
        #
        # Créer *ou* compléter : la release peut déjà exister — publiée depuis l'interface
        # GitHub (qui pose le tag, donc déclenche ce workflow), ou laissée par une
        # exécution précédente qu'on relance. `create` échouerait dans ces deux cas.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes
          fi
