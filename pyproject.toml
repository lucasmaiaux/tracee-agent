[project]
name = "tracee-agent"
version = "0.1.0"
description = "Agent de capture réseau pour Tracee"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []   # Scapy viendra avec la capture (#6), pas avant

[project.scripts]
tracee-agent = "tracee_agent.main:main"   # la commande → la fonction main()

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracee_agent"]
