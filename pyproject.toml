[project]
name = "tracee-agent"
version = "0.1.0"
description = "Agent de capture réseau pour Tracee"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scapy>=2.6.1",
    "structlog>=26.1.0",
    "websockets>=16.0",
]

[project.scripts]
tracee-agent = "tracee_agent.main:main"   # la commande → la fonction main()

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracee_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F : erreurs pycodestyle + pyflakes · I : tri des imports (remplace isort)
# UP : pyupgrade (syntaxe moderne) · B : bugs probables · SIM : simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# auto : toute fonction `async def test_*` est lancée comme test async, sans avoir
# à la décorer de @pytest.mark.asyncio.
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]
